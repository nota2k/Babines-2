
name: Build & Deploy Vue.js sur o2switch
 
on:
  push:
    branches:
      - review   # adapte au nom de ta branche de production
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
 
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
 
      - name: Installer les dépendances
        run: npm ci
 
      - name: Builder l'application (variables d'env de prod)
        run: npm run build
        env:
          VITE_COUCHDB_URL: ${{ secrets.VITE_COUCHDB_URL }}
          # ajoute ici toute autre variable VITE_/VUE_APP_ nécessaire au build
 
      - name: Déployer sur o2switch via rsync/SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/                     # dossier généré par le build (Vite) — 'build/' si Vue CLI/webpack
          remote_path: ${{ secrets.O2SWITCH_REMOTE_PATH }}   # ex: /home/USER/public_html/
          remote_host: ${{ secrets.O2SWITCH_HOST }}          # ex: monsite.fr ou l'IP du serveur
          remote_user: ${{ secrets.O2SWITCH_USER }}
          remote_key: ${{ secrets.O2SWITCH_SSH_KEY }}        # clé privée SSH (format PEM)
          remote_port: ${{ secrets.O2SWITCH_SSH_PORT }}      # généralement 22, parfois custom chez o2switch
 