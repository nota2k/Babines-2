---
name: 'deploy'

# Déploiement Dokku désactivé : il partait sur chaque push vers master, en
# même temps que o2switch.yml, vers un hébergement différent — et échouait
# faute de clé autorisée sur dokku@lehavre. o2switch est la cible retenue.
# Ce workflow reste lançable à la main depuis l'onglet Actions ; pour le
# réactiver automatiquement, remettre le bloc `push: branches: [master]`.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: 'ssh://dokku@lehavre.constructions-incongrues.net:22/babines.incongru.org'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
